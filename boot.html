<style>
/* ============================================================
   RUPIAH'S HUNTERS — BOOT AURUM EDITION
   Cinematic sequence · Monogram · Particles · Curtain exit
   Zero dependencies · Pure CSS + vanilla JS
   ============================================================ */

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#060912;
  --text:#f6f6f8;
  --text-soft:#b8bac1;
  --text-muted:#8a8c94;
  --text-dim:#4c4e55;
  --gold:#d8c7a1;
  --gold-soft:#b9a479;
  --gold-faint:rgba(216,199,161,.34);
  --border:rgba(255,255,255,.07);
  --border-strong:rgba(255,255,255,.16);
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-out:cubic-bezier(.22,.9,.2,1);
}

html{height:100%}

body{
  height:100%;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-feature-settings:"cv11","ss01","ss03","cv02","cv03","cv04";
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

/* ---------- NOISE OVERLAY ---------- */
body::before{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:40;
  opacity:.22;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
  mix-blend-mode:overlay;
}

/* ---------- CANVAS PARTICLES ---------- */
#particles{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
  pointer-events:none;
}

/* ---------- BACKGROUND ---------- */
.stage-bg{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}
.aurora{
  position:absolute;
  border-radius:50%;
  filter:blur(90px);
  opacity:0;
  will-change:transform;
}
.a1{
  width:72vw;height:72vw;
  top:-28vw;left:-12vw;
  background:radial-gradient(circle at 40% 40%,
    rgba(96,128,220,.14) 0%,
    rgba(60,86,172,.05) 42%,
    transparent 70%);
  animation:auroraIn 2.6s var(--ease) .1s forwards, drift1 19s ease-in-out 2.8s infinite alternate;
}
.a2{
  width:60vw;height:60vw;
  bottom:-22vw;right:-14vw;
  background:radial-gradient(circle at 60% 60%,
    rgba(150,175,240,.10) 0%,
    rgba(96,124,210,.04) 45%,
    transparent 72%);
  animation:auroraIn 3s var(--ease) .35s forwards, drift2 23s ease-in-out 3.2s infinite alternate;
}
.a3{
  width:44vw;height:44vw;
  top:30%;left:50%;
  margin-left:-22vw;
  background:radial-gradient(circle at 50% 50%,
    rgba(120,150,225,.08) 0%,
    rgba(90,116,200,.03) 48%,
    transparent 74%);
  animation:auroraIn 3.4s var(--ease) .55s forwards, drift3 21s ease-in-out 3.6s infinite alternate;
}
@keyframes auroraIn{to{opacity:1}}
@keyframes drift1{
  0%{transform:translate3d(0,0,0) scale(1)}
  100%{transform:translate3d(9vw,-5vw,0) scale(1.08)}
}
@keyframes drift2{
  0%{transform:translate3d(0,0,0) scale(1)}
  100%{transform:translate3d(-7vw,5vw,0) scale(1.06)}
}
@keyframes drift3{
  0%{transform:translate3d(0,0,0) scale(1)}
  100%{transform:translate3d(5vw,-4vw,0) scale(1.1)}
}

/* Grid paper */
.stage-bg .grid{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.016) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.016) 1px, transparent 1px);
  background-size:84px 84px;
  mask-image:radial-gradient(ellipse 60% 55% at 50% 48%, #000 15%, transparent 74%);
  -webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 48%, #000 15%, transparent 74%);
  opacity:0;
  animation:gridIn 2.2s var(--ease) .2s forwards, gridBreath 9s ease-in-out 3s infinite;
}
@keyframes gridIn{to{opacity:1}}
@keyframes gridBreath{0%,100%{opacity:.5}50%{opacity:1}}

/* Rotating radial rays — slow cinematic ring */
.stage-bg .rays{
  position:absolute;
  top:50%;left:50%;
  width:130vmax;height:130vmax;
  margin-left:-65vmax;margin-top:-65vmax;
  background:conic-gradient(from 0deg at 50% 50%,
    transparent 0deg,
    rgba(216,199,161,.035) 18deg,
    transparent 42deg,
    rgba(255,255,255,.018) 78deg,
    transparent 104deg,
    rgba(216,199,161,.03) 150deg,
    transparent 180deg,
    rgba(255,255,255,.02) 232deg,
    transparent 266deg,
    rgba(216,199,161,.03) 308deg,
    transparent 360deg);
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 0%, transparent 68%);
  mask-image:radial-gradient(circle at 50% 50%, #000 0%, transparent 68%);
  opacity:0;
  animation:raysIn 2.8s var(--ease) 1s forwards, raysSpin 90s linear infinite;
}
@keyframes raysIn{to{opacity:1}}
@keyframes raysSpin{to{transform:rotate(360deg)}}

/* ---------- STAGE ---------- */
.stage{
  position:relative;
  z-index:10;
  text-align:center;
  padding:0 28px;
  max-width:1200px;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/* ============================================
   MONOGRAM — drawn SVG crosshair + RH
   ============================================ */
.boot-mark{
  position:relative;
  width:clamp(116px,15vw,168px);
  height:clamp(116px,15vw,168px);
  margin-bottom:44px;
  opacity:0;
  transform:scale(.92);
  filter:blur(10px);
  animation:markIn 1.1s var(--ease) .15s forwards;
}
@keyframes markIn{
  0%{opacity:0;transform:scale(.92);filter:blur(10px)}
  60%{opacity:1;filter:blur(2px)}
  100%{opacity:1;transform:scale(1);filter:blur(0)}
}
.boot-mark svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
  transform:rotate(0deg);
}
.mark-ring{
  transform-origin:center;
  transform:rotate(-88deg);
}
.mark-ring .base{
  stroke:rgba(255,255,255,.06);
}
.mark-ring .draw{
  stroke:url(#goldGrad);
  stroke-linecap:round;
  stroke-dasharray:352;
  stroke-dashoffset:352;
  animation:ringDraw 1.9s var(--ease) .35s forwards;
}
@keyframes ringDraw{to{stroke-dashoffset:0}}

/* dotted rotation ring */
.mark-dots{
  transform-origin:center;
  transform:rotate(0deg);
  animation:dotsRot 26s linear 1.2s infinite;
}
.mark-dots circle{
  fill:none;
  stroke:rgba(255,255,255,.18);
  stroke-dasharray:1 12;
  stroke-width:1.4;
}
@keyframes dotsRot{to{transform:rotate(360deg)}}

/* crosshair ticks */
.mark-tick{
  stroke:rgba(255,255,255,.34);
  stroke-width:1.6;
  opacity:0;
  animation:tickIn .8s var(--ease) 1.4s forwards;
}
.mark-tick.gold{stroke:var(--gold-soft)}
@keyframes tickIn{to{opacity:1}}

/* diamond aperture */
.mark-aperture{
  fill:none;
  stroke:rgba(216,199,161,.42);
  stroke-width:1.4;
  stroke-dasharray:112;
  stroke-dashoffset:112;
  transform:rotate(45deg);
  transform-origin:center;
  animation:apertureDraw 1.7s var(--ease) 1.15s forwards;
}
@keyframes apertureDraw{to{stroke-dashoffset:0}}

/* scanning beam */
.mark-scan{
  position:absolute;
  left:18%;right:18%;top:50%;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-faint),transparent);
  box-shadow:0 0 14px rgba(216,199,161,.24);
  transform:translateY(-50%) scaleX(0);
  transform-origin:left center;
  animation:scanIn 1.3s var(--ease-out) 2.2s forwards, scanSweep 3.8s var(--ease-out) 3.6s infinite;
}
@keyframes scanIn{to{transform:translateY(-50%) scaleX(1)}}
@keyframes scanSweep{
  0%{transform:translateY(-50%) translateX(-2%) scaleX(.35);opacity:.25}
  50%{transform:translateY(-50%) translateX(2%) scaleX(1);opacity:.9}
  100%{transform:translateY(-50%) translateX(-2%) scaleX(.35);opacity:.25}
}

.boot-mark .mark-inner{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Instrument Serif','Times New Roman',Georgia,serif;
  font-style:italic;
  font-size:clamp(34px,4.6vw,50px);
  letter-spacing:.08em;
  color:var(--text);
  text-shadow:
    0 0 1px rgba(255,255,255,.3),
    0 0 26px rgba(255,255,255,.14),
    0 0 60px rgba(216,199,161,.06);
  animation:innerGlow 4s ease-in-out 2s infinite;
}
@keyframes innerGlow{
  0%,100%{text-shadow:0 0 1px rgba(255,255,255,.3),0 0 26px rgba(255,255,255,.14),0 0 60px rgba(216,199,161,.10)}
  50%{text-shadow:0 0 2px rgba(255,255,255,.4),0 0 40px rgba(255,255,255,.22),0 0 90px rgba(216,199,161,.10)}
}

/* ============================================
   LABEL — letterspaced stagger
   ============================================ */
.boot-label{
  display:flex;
  align-items:center;
  gap:22px;
  font-size:10px;
  font-weight:500;
  letter-spacing:.34em;
  text-transform:uppercase;
  color:var(--text-dim);
  margin-bottom:46px;
  transform:translateY(6px);
  opacity:0;
  animation:labelIn 1s var(--ease) 2.2s forwards;
}
@keyframes labelIn{to{opacity:1;transform:none}}
.boot-label::before,
.boot-label::after{
  content:'';
  display:block;
  width:44px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--border-strong));
  transform:scaleX(0);
  transform-origin:right center;
  animation:labelRule 1.2s var(--ease) 2.55s forwards;
}
.boot-label::after{
  transform-origin:left center;
  background:linear-gradient(90deg,var(--border-strong),transparent);
}
@keyframes labelRule{to{transform:scaleX(1)}}

/* ============================================
   TYPEWRITER TITLE
   ============================================ */
.boot-title{
  position:relative;
  font-family:'Instrument Serif','Times New Roman',Georgia,serif;
  font-style:italic;
  font-weight:400;
  font-size:clamp(3rem,9vw,7.4rem);
  letter-spacing:-.016em;
  line-height:1.03;
  display:inline-block;
  text-align:center;
  min-height:1.15em;
  color:#f6f6f9;
  -webkit-text-fill-color:#f6f6f9;
  text-shadow:
    0 0 2px rgba(255,255,255,.28),
    0 0 34px rgba(255,255,255,.12),
    0 0 90px rgba(216,199,161,.04);
}

/* Shine sweep — runs once after typing then subtle idle */
.boot-title::after{
  content:'';
  position:absolute;
  top:0;bottom:0;left:-30%;
  width:22%;
  background:linear-gradient(105deg,
    transparent 0%,
    rgba(255,255,255,.07) 40%,
    rgba(255,255,255,.16) 50%,
    rgba(255,255,255,.07) 60%,
    transparent 100%);
  transform:skewX(-16deg);
  opacity:0;
  will-change:transform,opacity;
}
.boot-title.shine::after{
  animation:titleShine 1.5s var(--ease) 1.2s 1;
}
@keyframes titleShine{
  0%{left:-30%;opacity:0}
  12%{opacity:1}
  55%{left:120%;opacity:1}
  100%{left:120%;opacity:0}
}

.tw-stack{display:inline-grid;place-items:center;position:relative}
.tw-measure,.tw-live{grid-area:1 / 1;white-space:nowrap;letter-spacing:inherit;font:inherit}
.tw-measure{visibility:hidden;pointer-events:none;user-select:none}
.tw-live{justify-self:start;text-align:left;position:relative;display:inline-block}

/* per-character ink-in with rotation + bloom */
.tw-char{
  display:inline-block;
  white-space:pre;
  color:inherit;
  -webkit-text-fill-color:inherit;
  will-change:opacity,transform,filter;
  animation:ink-in .62s var(--ease) both;
}
.tw-char.gold{
  color:var(--gold);
  -webkit-text-fill-color:var(--gold);
  text-shadow:0 0 18px rgba(216,199,161,.26);
}
.tw-char.space{width:.24em}
@keyframes ink-in{
  0%{
    opacity:0;
    transform:translateY(.12em) rotate(3deg) scale(.92);
    filter:blur(6px);
  }
  55%{
    opacity:1;
    filter:blur(1px);
  }
  100%{
    opacity:1;
    transform:none;
    filter:blur(0);
  }
}

/* caret */
.typewriter-cursor{
  position:absolute;
  left:100%;
  top:.26em;
  margin-left:.12em;
  width:2px;
  height:.56em;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(216,199,161,.5));
  border-radius:1px;
  box-shadow:0 0 14px rgba(216,199,161,.3);
  animation:cursor-blink 1s steps(1) infinite;
}
.typewriter-cursor.done{
  animation:cursor-fade 1.6s var(--ease) forwards;
}
@keyframes cursor-blink{0%,48%{opacity:1}49%,100%{opacity:.1}}
@keyframes cursor-fade{0%{opacity:.75}30%{opacity:1}70%{opacity:1}100%{opacity:0}}

/* ============================================
   RULE + SUBTITLE
   ============================================ */
.boot-rule{
  width:min(58%,380px);
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-faint),transparent);
  margin:44px auto 30px;
  transform:scaleX(0);
  opacity:0;
}
.boot-rule.show{animation:rule-draw 1.3s var(--ease) forwards}
@keyframes rule-draw{to{transform:scaleX(1);opacity:1}}

.boot-sub{
  font-size:clamp(.92rem,1.3vw,1.02rem);
  color:var(--text-muted);
  letter-spacing:.06em;
  line-height:1.6;
  font-weight:300;
  opacity:0;
  transform:translateY(10px);
  filter:blur(4px);
}
.boot-sub.show{
  animation:subIn 1.1s var(--ease) forwards;
}
@keyframes subIn{to{opacity:1;transform:none;filter:blur(0)}}
.boot-sub b{font-weight:500;color:var(--text-soft)}

/* ============================================
   CURSOR RING (boot) — subtle hunter crosshair
   ============================================ */
.boot-cursor{
  position:fixed;
  top:0;left:0;
  z-index:200;
  pointer-events:none;
  width:22px;height:22px;
  margin-left:-11px;margin-top:-11px;
  border:1px solid rgba(216,199,161,.36);
  border-radius:50%;
  opacity:0;
  transition:opacity .4s ease;
  will-change:transform;
}
.boot-cursor::before,.boot-cursor::after{
  content:'';
  position:absolute;
  background:rgba(216,199,161,.48);
}
.boot-cursor::before{
  left:50%;top:-3px;bottom:-3px;width:1px;
  transform:translateX(-50%);
}
.boot-cursor::after{
  top:50%;left:-3px;right:-3px;height:1px;
  transform:translateY(-50%);
}
.boot-cursor.on{opacity:1}
@media (hover:none){.boot-cursor{display:none}}

/* ============================================
   FOOT — status + progress
   ============================================ */
.boot-foot{
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:20;
  padding:0 36px 30px;
  opacity:0;
  animation:fadeIn 1.2s var(--ease) .5s forwards;
}
.boot-progress{
  position:relative;
  width:100%;
  height:1px;
  background:rgba(255,255,255,.07);
  overflow:hidden;
}
.boot-progress-fill{
  position:absolute;
  top:0;left:0;
  height:100%;
  width:100%;
  background:linear-gradient(90deg,
    rgba(255,255,255,.16),
    var(--gold-faint),
    #f5efe2);
  background-size:200% 100%;
  animation:progressSheen 2.4s linear infinite;
  transform:scaleX(0);
  transform-origin:0 50%;
  transition:transform .12s linear;
  box-shadow:0 0 10px rgba(216,199,161,.26);
}
@keyframes progressSheen{
  0%{background-position:0% 0}
  100%{background-position:200% 0}
}
.boot-meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-top:16px;
  font-size:10px;
  font-weight:500;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--text-dim);
  font-variant-numeric:tabular-nums;
}
.boot-status{
  display:flex;
  align-items:center;
  gap:10px;
}
.boot-status::before{
  content:'';
  width:5px;height:5px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 8px rgba(216,199,161,.55);
  animation:statusPulse 1.4s ease-in-out infinite;
}
@keyframes statusPulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.boot-percent{
  display:flex;
  align-items:baseline;
  gap:3px;
  color:var(--text-muted);
}
.boot-percent small{font-size:8.5px;letter-spacing:.1em}

/* ============================================
   SKIP
   ============================================ */
.boot-skip{
  position:fixed;
  top:28px;
  right:32px;
  z-index:60;
  font-size:10px;
  font-weight:500;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--text-muted);
  padding:10px 18px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  border-radius:100px;
  backdrop-filter:blur(16px) saturate(180%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  transition:all .35s var(--ease);
  opacity:0;
  cursor:pointer;
  animation:fadeIn .9s var(--ease) 2.8s forwards;
  text-decoration:none;
  line-height:1;
}
.boot-skip:hover{
  background:rgba(255,255,255,.08);
  border-color:var(--border-strong);
  color:var(--text);
  transform:translateY(-1px) translateX(-1px);
  box-shadow:0 10px 30px rgba(0,0,0,.45);
}
.boot-skip:active{transform:translateY(0)}

/* ============================================
   EXIT CURTAIN — two-panel wipe
   ============================================ */
.boot-curtain{
  position:fixed;
  inset:0;
  z-index:120;
  pointer-events:none;
  visibility:hidden;
}
.curtain-half{
  position:absolute;
  top:0;bottom:0;
  width:50.5%;
  background:#060608;
  background-image:linear-gradient(180deg,rgba(216,199,161,.05),transparent 55%);
  transform:translateX(-110%);
  will-change:transform;
}
.curtain-half.right{
  left:auto;right:0;
  transform:translateX(110%);
}
body.boot-out .curtain-half{
  transition:transform 1.05s var(--ease);
}
body.boot-out .curtain-half{
  transform:none;
}

/* content fade-out during exit */
body.boot-out .stage,
body.boot-out .boot-foot,
body.boot-out .boot-skip,
body.boot-out .stage-bg,
body.boot-out #particles{
  transition:opacity .8s var(--ease), transform .8s var(--ease), filter .8s var(--ease);
  opacity:0;
  transform:scale(1.03);
  filter:blur(10px);
}

/* ============================================
   RESPONSIVE
   ============================================ */
@media (max-width:640px){
  .boot-label{letter-spacing:.24em;gap:14px;margin-bottom:38px}
  .boot-label::before,.boot-label::after{width:24px}
  .boot-rule{margin:34px auto 24px;width:min(72%,260px)}
  .boot-foot{padding:0 22px 26px}
  .boot-skip{top:22px;right:20px;padding:9px 15px;font-size:9px}
  .boot-mark{margin-bottom:34px}
}

/* ============================================
   REDUCED MOTION
   ============================================ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
  .a1,.a2,.a3,.boot-title::after,.scan,
  .mark-dots,.rays{display:none !important}
  .boot-mark,
  .boot-label,
  .boot-sub,
  .boot-foot,
  .boot-skip{opacity:1;transform:none;filter:none}
  .boot-rule{transform:scaleX(1);opacity:1}
  .boot-mark .mark-ring .draw{stroke-dashoffset:0}
  .mark-tick,.mark-aperture{opacity:1;stroke-dashoffset:0}
  .typewriter-cursor{display:none}
  .tw-char{opacity:1 !important;transform:none !important;filter:none !important}
  body.boot-out .stage,
  body.boot-out .boot-foot,
  body.boot-out .boot-skip,
  body.boot-out .stage-bg,
  body.boot-out #particles{opacity:1;transform:none;filter:none}
}
</style>
</head>
<body>

<!-- background -->
<div class="stage-bg" id="stageBg" aria-hidden="true">
  <div class="aurora a1"></div>
  <div class="aurora a2"></div>
  <div class="aurora a3"></div>
  <div class="grid"></div>
  <div class="rays"></div>
</div>

<canvas id="particles" aria-hidden="true"></canvas>

<!-- boot cursor crosshair -->
<div class="boot-cursor" id="bootCursor" aria-hidden="true"></div>

<!-- skip -->
<a href="#" class="boot-skip" id="skipBtn" role="button">Lewati</a>

<!-- ================= STAGE ================= -->
<main class="stage">

  <!-- monogram -->
  <figure class="boot-mark" id="bootMark" aria-hidden="true">
    <svg viewBox="0 0 120 120" fill="none">
      <defs>
        <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f5f5f7" stop-opacity=".95"/>
          <stop offset=".55" stop-color="#d8c7a1"/>
          <stop offset="1" stop-color="#b9a479"/>
        </linearGradient>
      </defs>

      <!-- outer ring -->
      <g class="mark-ring">
        <circle class="base" cx="60" cy="60" r="56" stroke-width="1"/>
        <circle class="draw" cx="60" cy="60" r="56" stroke-width="1.6"/>
      </g>

      <!-- dotted rotation ring -->
      <g class="mark-dots">
        <circle cx="60" cy="60" r="47"/>
      </g>

      <!-- crosshair ticks -->
      <g>
        <line class="mark-tick" x1="60" y1="2" x2="60" y2="13"/>
        <line class="mark-tick gold" x1="60" y1="107" x2="60" y2="118"/>
        <line class="mark-tick" x1="2" y1="60" x2="13" y2="60"/>
        <line class="mark-tick gold" x1="107" y1="60" x2="118" y2="60"/>
      </g>

      <!-- diamond aperture -->
      <rect class="mark-aperture" x="60" y="60" width="38" height="38" rx="3"
            transform="translate(-19 -19)"/>
    </svg>

    <span class="mark-scan"></span>
    <span class="mark-inner">RH</span>
  </figure>

  <!-- label -->
  <div class="boot-label">Komunitas Bisnis &amp; Karier</div>

  <!-- title -->
  <h1 class="boot-title" id="bootTitle">
    <span class="tw-stack">
      <span class="tw-measure" aria-hidden="true">Rupiah's Hunters</span>
      <span class="tw-live">
        <span id="twContent" aria-label="Rupiah's Hunters"></span><span class="typewriter-cursor" id="cursor" aria-hidden="true"></span>
      </span>
    </span>
  </h1>

  <div class="boot-rule" id="bootRule" aria-hidden="true"></div>
  <p class="boot-sub" id="bootSub">Dari <b>niat</b>, jadi <b>nyata</b>.</p>
</main>

<!-- ================= FOOT ================= -->
<div class="boot-foot" aria-hidden="true">
  <div class="boot-progress">
    <div class="boot-progress-fill" id="progressFill"></div>
  </div>
  <div class="boot-meta">
    <span class="boot-status" id="bootStatus">MEMULAI</span>
    <span class="boot-percent"><span id="bootCounter">00</span><small>%</small></span>
  </div>
</div>

<!-- exit curtain -->
<div class="boot-curtain" id="bootCurtain" aria-hidden="true">
  <div class="curtain-half"></div>
  <div class="curtain-half right"></div>
</div>

<script>
(function(){
  'use strict';

  /* ============================================
     KONFIGURASI — jangan-jangan mau diutak-atik
     ============================================ */
  var CFG = {
    text: "Rupiah's Hunters",
    markDelay: 1500,        // jeda sebelum typing (monogram+label)
    typeSpeed: 88,
    afterTypeDelay: 620,
    exitAfter: 1650,        // ms setelah typing selesai → mulai exit
    exitDuration: 1080,     // durasi curtain
    goldChars: ['H'],       // huruf yang disorot lime-emas? no — gold
  };

  var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- ELEMEN ---------- */
  var contentEl = document.getElementById('twContent');
  var cursorEl  = document.getElementById('cursor');
  var ruleEl    = document.getElementById('bootRule');
  var subEl     = document.getElementById('bootSub');
  var titleEl   = document.getElementById('bootTitle');
  var counterEl = document.getElementById('bootCounter');
  var fillEl    = document.getElementById('progressFill');
  var statusEl  = document.getElementById('bootStatus');
  var skipBtn   = document.getElementById('skipBtn');
  var curtainEl = document.getElementById('bootCurtain');
  var canvas    = document.getElementById('particles');

  var pad = function(n){ return (n < 10 ? '0' + n : '' + n); };

  /* ============================================
     STATUS STAGES
     ============================================ */
  var stages = [
    { at: 0.00, label: 'MEMULAI' },
    { at: 0.14, label: 'MENGINISIALISASI' },
    { at: 0.32, label: 'MEMUAT TEMA' },
    { at: 0.52, label: 'MENGUKUR TIPOGRAFI' },
    { at: 0.72, label: 'MEMBURU PELUANG' },
    { at: 0.92, label: 'SIAP' },
  ];

  /* ============================================
     PARTICLE FIELD — bianglala debu
     ============================================ */
  function initParticles(){
    if (!canvas || prefersReducedMotion) return;
    if (canvas.getContext) {
      try { startParticles(); } catch(e){ /* abaikan */ }
    }
  }

  var particleCtx, particleCount, particles, frameId = 0;

  function startParticles(){
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    particleCtx = ctx;
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas, { passive:true });

    var isSmall = window.innerWidth < 640;
    particleCount = isSmall ? 26 : 54;
    particles = [];
    for (var i=0;i<particleCount;i++){
      particles.push({
        x: Math.random(),
        y: Math.random(),
        r: Math.random() * 1.4 + .4,
        speed: Math.random() * .00022 + .00005,
        drift: (Math.random() - .5) * .00012,
        tw: Math.random() * Math.PI * 2,
        gold: Math.random() < .32,
      });
    }
    drawParticles();
  }

  function resizeCanvas(){
    canvas.width  = window.innerWidth  * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width  = window.innerWidth  + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }

  function drawParticles(){
    if (document.hidden){ frameId = requestAnimationFrame(drawParticles); return; }
    var ctx = particleCtx;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    var i, p;
    for (i=0;i<particleCount;i++){
      p = particles[i];
      p.y -= p.speed;
      p.x += p.drift;
      p.tw += .018;
      if (p.y < -.02){ p.y = 1.02; p.x = Math.random(); }
      if (p.x < -.02){ p.x = 1.02; } else if (p.x > 1.02){ p.x = -.02; }

      var alpha = (.18 + .3 * (0.5 + 0.5 * Math.sin(p.tw)));
      var color = p.gold ? '216,199,161' : '255,255,255';
      ctx.beginPath();
      ctx.arc(p.x * canvas.width, p.y * canvas.height, p.r * devicePixelRatio, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + color + ',' + alpha.toFixed(3) + ')';
      ctx.fill();
    }
    frameId = requestAnimationFrame(drawParticles);
  }

  /* ============================================
     BOOT CURSOR — ring crosshair memburu kursor
     ============================================ */
  function initBootCursor(){
    var c = document.getElementById('bootCursor');
    if (!c) return;
    if (prefersReducedMotion) return;
    if (window.matchMedia('(hover: none)').matches) return;

    var x = innerWidth/2, y = innerHeight/2, cx = x, cy = y;
    var on = false;
    var has = false;

    window.addEventListener('mousemove', function(e){
      x = e.clientX; y = e.clientY;
      if (!has){ cx = x; cy = y; has = true; }
      if (!on){ c.classList.add('on'); on = true; }
    }, { passive:true });

    (function loop(){
      cx += (x - cx) * .16;
      cy += (y - cy) * .16;
      c.style.transform = 'translate3d(' + cx + 'px,' + cy + 'px,0)';
      requestAnimationFrame(loop);
    })();
  }

  /* ============================================
     1. TYPEWRITER
     ============================================ */
  function typeWriter(onDone){
    if (!contentEl) return;

    var chars = Array.from(CFG.text);
    var i = 0;

    function type(){
      if (i >= chars.length){
        if (cursorEl) cursorEl.classList.add('done');
        if (titleEl) titleEl.classList.add('shine');
        setTimeout(onDone, CFG.afterTypeDelay);
        return;
      }

      var ch = chars[i];
      var span = document.createElement('span');
      span.className = 'tw-char' + (ch === ' ' ? ' space' : '');
      span.textContent = ch === ' ' ? '\u00A0' : ch;

      contentEl.appendChild(span);
      i++;

      var delay = CFG.typeSpeed;
      if (ch === ' ')  delay += 70;
      if (ch === "'")  delay += 110;
      if (ch === '.')  delay += 130;

      setTimeout(type, delay);
    }

    setTimeout(type, 80);
  }

  /* ============================================
     2. PROGRESS + COUNTER + STATUS
     ============================================ */
  function startProgress(totalDuration){
    var start = performance.now();
    var lastStage = -1;

    function frame(now){
      var t = Math.min((now - start) / totalDuration, 1);
      var eased = 1 - Math.pow(1 - t, 3.6);
      var value = Math.round(eased * 100);

      if (counterEl) counterEl.textContent = pad(value);
      if (fillEl)    fillEl.style.transform = 'scaleX(' + eased + ')';

      var stageIdx = stages.length - 1;
      for (var i=0;i<stages.length;i++){
        if (t >= stages[i].at) stageIdx = i;
        else break;
      }
      if (stageIdx !== lastStage){
        lastStage = stageIdx;
        if (statusEl && stages[stageIdx]){
          statusEl.textContent = stages[stageIdx].label;
        }
      }

      if (t < 1) requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  }

  /* ============================================
     3. EXIT + REDIRECT (handoff ke index)
     Penanda ?booted=1 memberitahu index bahwa
     kedatangannya DARI boot — jadi index tak
     akan mengulang boot lagi.
     ============================================ */
  var redirected = false;

  function finishBoot(){
    if (redirected) return;
    redirected = true;
    try { sessionStorage.setItem('rh_booted','1'); } catch(e){}

    if (prefersReducedMotion){
      window.location.href = 'index.html?booted=1';
      return;
    }

    document.body.classList.add('boot-out');

    setTimeout(function(){
      window.location.href = 'index.html?booted=1';
    }, CFG.exitDuration + 120);
  }

  function skipBoot(e){
    if (e && e.preventDefault) e.preventDefault();
    finishBoot();
  }

  /* ============================================
     4. AFTER TYPING
     ============================================ */
  function onTypingComplete(){
    setTimeout(function(){
      if (ruleEl) ruleEl.classList.add('show');
    }, 140);
    setTimeout(function(){
      if (subEl) subEl.classList.add('show');
    }, 520);
  }

  /* ============================================
     5. BOOT
     ============================================ */
  function estimateTypeDuration(){
    var total = 80;
    Array.from(CFG.text).forEach(function(ch){
      total += CFG.typeSpeed;
      if (ch === ' ')  total += 70;
      if (ch === "'")  total += 110;
      if (ch === '.')  total += 130;
    });
    total += CFG.afterTypeDelay;
    return total;
  }

  function boot(){
    initParticles();

    if (prefersReducedMotion){

      contentEl.textContent = CFG.text;
      if (ruleEl) ruleEl.classList.add('show');
      if (subEl)  subEl.classList.add('show');
      if (counterEl) counterEl.textContent = '100';
      if (fillEl)  fillEl.style.transform = 'scaleX(1)';
      if (statusEl) statusEl.textContent = 'SIAP';
      setTimeout(finishBoot, 1200);
      return;
    }

    var typeDur = estimateTypeDuration();
    var total   = CFG.markDelay + typeDur + CFG.exitAfter;

    startProgress(total);

    // typewriter mulai setelah monogram+label tenang
    setTimeout(function(){ typeWriter(onTypingComplete); }, CFG.markDelay);

    // exit
    setTimeout(finishBoot, total);
  }

  /* ============================================
     EVENTS — skip via tombol / klik di area mana pun
     ============================================ */
  if (skipBtn) skipBtn.addEventListener('click', skipBoot);

  // allow instant skip
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' '){
      skipBoot(e);
    }
  });

  // klik di mana pun melompatkan boot (premium = tidak menahan user)
  document.addEventListener('pointerdown', function(e){
    if (e.target.closest('.boot-skip')) return;
    if (e.target.closest('.boot-curtain')) return;
    skipBoot(e);
  });

  /* ============================================
     INIT
     ============================================ */
  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){
      boot();
      initBootCursor();
    });
  } else {
    boot();
    initBootCursor();
  }

})();
</script>
</body>
</html>
