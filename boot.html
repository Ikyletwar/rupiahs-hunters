<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050507">
<title>Rupiah's Hunters</title>
<meta name="description" content="Sebuah komunitas bisnis & karier. Dari niat, jadi nyata.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
/* ============================================
   RUPIAH'S HUNTERS — BOOT
   Typewriter · Perfect Center · Instrument Serif
   ============================================ */

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#050507;
  --text:#f6f6f8;
  --text-soft:#b8bac1;
  --text-muted:#84868e;
  --text-dim:#4a4c53;
  --border:rgba(255,255,255,.06);
  --border-strong:rgba(255,255,255,.14);
  --ease:cubic-bezier(.16,1,.3,1);
}

html{
  height:100%;
  background:var(--bg);
}

body{
  height:100%;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-feature-settings:"cv11","ss01","ss03","cv02","cv03","cv04";
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

/* Noise */
body::before{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
  opacity:.28;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
  mix-blend-mode:overlay;
}

/* ============================================
   BACKGROUND
   ============================================ */
.stage-bg{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}
.stage-bg::before{
  content:'';
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:1000px;height:1000px;
  background:radial-gradient(circle at center,
    rgba(255,255,255,.085) 0%,
    rgba(255,255,255,.028) 30%,
    transparent 68%);
  filter:blur(30px);
  opacity:0;
  animation:glow-in 3s var(--ease) 0s forwards;
}
.stage-bg::after{
  content:'';
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.016) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.016) 1px, transparent 1px);
  background-size:88px 88px;
  mask-image:radial-gradient(ellipse 55% 55% at 50% 50%, #000 20%, transparent 72%);
  -webkit-mask-image:radial-gradient(ellipse 55% 55% at 50% 50%, #000 20%, transparent 72%);
  opacity:0;
  animation:glow-in 2.4s var(--ease) .3s forwards;
}
@keyframes glow-in { to { opacity: 1; } }

/* ============================================
   STAGE
   ============================================ */
.stage{
  position:relative;
  z-index:2;
  text-align:center;
  padding:0 24px;
  max-width:1200px;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.boot-label{
  display:inline-flex;
  align-items:center;
  gap:14px;
  font-family:'Inter',sans-serif;
  font-size:10px;
  font-weight:500;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--text-dim);
  margin-bottom:56px;
  opacity:0;
  animation:fade-in-soft 1s var(--ease) .2s forwards;
}
.boot-label::before,
.boot-label::after{
  content:'';
  display:block;
  width:20px;
  height:1px;
  background:var(--border-strong);
}

/* ============================================
   TYPEWRITER TITLE
   ============================================ */
.boot-title{
  font-family:'Instrument Serif', 'Times New Roman', Georgia, serif;
  font-style:italic;
  font-weight:400;
  font-size:clamp(2.8rem, 8.5vw, 7rem);
  letter-spacing:-.018em;
  line-height:1.05;
  margin:0;
  display:inline-block;
  text-align:center;
  min-height:1.15em;

  color:#f6f6f9;
  -webkit-text-fill-color:#f6f6f9;

  text-shadow:
    0 0 1px rgba(255,255,255,.25),
    0 0 30px rgba(255,255,255,.12),
    0 0 80px rgba(255,255,255,.05);
}

.tw-stack{
  display:inline-grid;
  place-items:center;
  position:relative;
}

.tw-measure,
.tw-live{
  grid-area:1 / 1;
  white-space:nowrap;
  letter-spacing:inherit;
  font:inherit;
}

.tw-measure{
  visibility:hidden;
  pointer-events:none;
  user-select:none;
}

.tw-live{
  justify-self:start;
  text-align:left;
  position:relative;
  display:inline-block;
}

.tw-char{
  display:inline-block;
  white-space:pre;
  color:inherit;
  -webkit-text-fill-color:inherit;
  will-change:opacity, transform, filter;
  animation:ink-in .6s var(--ease) both;
}
.tw-char.space{
  width:.24em;
}
@keyframes ink-in {
  0% {
    opacity:0;
    transform:translateY(.08em) scale(.98);
    filter:blur(3.5px);
  }
  55% {
    opacity:1;
    filter:blur(.5px);
  }
  100% {
    opacity:1;
    transform:none;
    filter:blur(0);
  }
}

.typewriter-cursor{
  position:absolute;
  left:100%;
  top:.34em;
  margin-left:.1em;
  width:2px;
  height:.5em;
  background:linear-gradient(180deg,
    rgba(255,255,255,.95) 0%,
    rgba(255,255,255,.4) 100%);
  border-radius:1px;
  box-shadow:0 0 12px rgba(255,255,255,.4);
  animation:cursor-blink 1.1s steps(1) infinite;
  will-change:opacity;
}
.typewriter-cursor.done{
  animation:cursor-fade 1.8s var(--ease) forwards;
}
@keyframes cursor-blink {
  0%, 48%   { opacity:1; }
  49%, 100% { opacity:.12; }
}
@keyframes cursor-fade {
  0%   { opacity:.7; }
  25%  { opacity:1; }
  55%  { opacity:1; }
  100% { opacity:0; }
}

/* ============================================
   HAIRLINE RULE
   ============================================ */
.boot-rule{
  width:min(60%, 380px);
  height:1px;
  background:linear-gradient(90deg,
    transparent,
    rgba(255,255,255,.55),
    transparent);
  margin:48px auto 34px;
  transform:scaleX(0);
  opacity:0;
}
.boot-rule.show{
  animation:rule-draw 1.4s var(--ease) forwards;
}
@keyframes rule-draw {
  to { transform:scaleX(1); opacity:1; }
}

/* ============================================
   SUBTITLE
   ============================================ */
.boot-sub{
  font-family:'Inter',sans-serif;
  font-size:clamp(.9rem, 1.15vw, 1rem);
  color:var(--text-muted);
  letter-spacing:.03em;
  line-height:1.6;
  font-weight:400;
  opacity:0;
  transform:translateY(8px);
}
.boot-sub.show{
  animation:fade-up 1s var(--ease) forwards;
}

@keyframes fade-in-soft {
  from { opacity:0; }
  to { opacity:1; }
}
@keyframes fade-up {
  from { opacity:0; transform:translateY(8px); }
  to { opacity:1; transform:translateY(0); }
}

/* ============================================
   FOOT — progress bar
   ============================================ */
.boot-foot{
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:5;
  padding:0 32px 26px;
  opacity:0;
  animation:fade-in-soft 1s var(--ease) .8s forwards;
}
.boot-progress{
  position:relative;
  width:100%;
  height:1px;
  background:rgba(255,255,255,.06);
  overflow:hidden;
}
.boot-progress-fill{
  position:absolute;
  top:0;left:0;
  height:100%;
  width:100%;
  background:linear-gradient(90deg,
    rgba(255,255,255,.18),
    rgba(255,255,255,.75));
  transform:scaleX(0);
  transform-origin:0 50%;
  transition:transform .1s linear;
}
.boot-meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-top:14px;
  font-family:'Inter',sans-serif;
  font-size:10.5px;
  font-weight:500;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--text-dim);
  font-variant-numeric:tabular-nums;
}
.boot-counter{color:var(--text-muted)}

/* ============================================
   SKIP
   ============================================ */
.boot-skip{
  position:fixed;
  top:26px;
  right:28px;
  z-index:10;
  font-family:'Inter',sans-serif;
  font-size:10.5px;
  font-weight:500;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--text-muted);
  padding:9px 16px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  border-radius:100px;
  backdrop-filter:blur(16px) saturate(180%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  transition:all .35s var(--ease);
  opacity:0;
  animation:fade-in-soft .9s var(--ease) 1.4s forwards;
  text-decoration:none;
}
.boot-skip:hover{
  background:rgba(255,255,255,.07);
  border-color:var(--border-strong);
  color:var(--text);
  transform:translateY(-1px);
}

/* ============================================
   EXIT
   ============================================ */
body.boot-out .stage,
body.boot-out .boot-foot,
body.boot-out .boot-skip,
body.boot-out .stage-bg{
  opacity:0;
  transition:opacity .7s var(--ease);
}

/* ============================================
   RESPONSIVE
   ============================================ */
@media (max-width:640px){
  .boot-label{
    font-size:9px;
    letter-spacing:.22em;
    margin-bottom:44px;
    gap:10px;
  }
  .boot-label::before,
  .boot-label::after{width:14px}
  .boot-rule{
    margin:36px auto 28px;
    width:min(70%, 260px);
  }
  .boot-foot{padding:0 20px 22px}
  .boot-skip{top:20px;right:18px;padding:8px 13px;font-size:10px}
}

/* ============================================
   REDUCED MOTION
   ============================================ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
  .boot-label,
  .boot-sub,
  .boot-foot,
  .boot-skip{opacity:1; transform:none}
  .boot-rule{transform:scaleX(1); opacity:1}
  .typewriter-cursor{display:none}
  .tw-char{opacity:1 !important; transform:none !important; filter:none !important}
}
</style>
</head>
<body>

<div class="stage-bg" aria-hidden="true"></div>

<a href="index.html?booted=1" class="boot-skip" id="skipBtn">Masuk →</a>

<main class="stage">
  <span class="boot-label">Komunitas Bisnis &amp; Karier</span>

  <h1 class="boot-title">
    <span class="tw-stack">
      <span class="tw-measure" aria-hidden="true">Rupiah's Hunters</span>
      <span class="tw-live">
        <span id="twContent" aria-label="Rupiah's Hunters"></span><span class="typewriter-cursor" id="cursor" aria-hidden="true"></span>
      </span>
    </span>
  </h1>

  <div class="boot-rule" id="bootRule" aria-hidden="true"></div>
  <p class="boot-sub" id="bootSub">Dari niat, jadi nyata.</p>
</main>

<div class="boot-foot" aria-hidden="true">
  <div class="boot-progress">
    <div class="boot-progress-fill" id="progressFill"></div>
  </div>
  <div class="boot-meta">
    <span id="bootStatus">Memuat</span>
    <span class="boot-counter" id="bootCounter">00</span>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ============================================
     KONFIGURASI
     ============================================ */
  const CFG = {
    text: "Rupiah's Hunters",
    typeSpeed: 95,
    startDelay: 700,
    afterTypeDelay: 500,
    redirectUrl: 'index.html?booted=1',   /* ← penanda sudah lewat boot */
    fadeOutDelay: 700,
  };

  const prefersReducedMotion = window.matchMedia(
    '(prefers-reduced-motion: reduce)'
  ).matches;

  /* ============================================
     ELEMEN
     ============================================ */
  const contentEl  = document.getElementById('twContent');
  const cursorEl   = document.getElementById('cursor');
  const ruleEl     = document.getElementById('bootRule');
  const subEl      = document.getElementById('bootSub');
  const counterEl  = document.getElementById('bootCounter');
  const fillEl     = document.getElementById('progressFill');
  const statusEl   = document.getElementById('bootStatus');
  const skipBtn    = document.getElementById('skipBtn');

  const pad = (n) => (n < 10 ? '0' + n : '' + n);

  /* ============================================
     1. TYPEWRITER
     ============================================ */
  function typeWriter(onDone){
    if (!contentEl) return;

    const chars = Array.from(CFG.text);
    let i = 0;

    function type(){
      if (i >= chars.length){
        if (cursorEl) cursorEl.classList.add('done');
        setTimeout(onDone, CFG.afterTypeDelay);
        return;
      }

      const ch = chars[i];

      const span = document.createElement('span');
      span.className = 'tw-char' + (ch === ' ' ? ' space' : '');
      span.textContent = ch === ' ' ? '\u00A0' : ch;

      contentEl.appendChild(span);
      i++;

      let delay = CFG.typeSpeed;
      if (ch === ' ')  delay += 55;
      if (ch === ',')  delay += 110;
      if (ch === "'")  delay += 40;
      if (ch === '.')  delay += 150;

      setTimeout(type, delay);
    }

    setTimeout(type, CFG.startDelay);
  }

  /* ============================================
     2. PROGRESS + COUNTER
     ============================================ */
  function startProgress(totalDuration){
    const start = performance.now();

    function frame(now){
      const t = Math.min((now - start) / totalDuration, 1);
      const eased = 1 - Math.pow(1 - t, 4);
      const value = Math.round(eased * 100);

      if (counterEl) counterEl.textContent = pad(value);
      if (fillEl)    fillEl.style.transform = `scaleX(${eased})`;

      if (t < 1){
        requestAnimationFrame(frame);
      } else if (statusEl){
        statusEl.textContent = 'Siap';
      }
    }

    requestAnimationFrame(frame);
  }

  /* ============================================
     3. FADE OUT + REDIRECT
     ============================================ */
  let redirected = false;

  function fadeOutAndGo(){
    if (redirected) return;
    redirected = true;

    document.body.classList.add('boot-out');

    setTimeout(() => {
      window.location.href = CFG.redirectUrl;
    }, prefersReducedMotion ? 120 : CFG.fadeOutDelay);
  }

  /* ============================================
     4. AFTER TYPING
     ============================================ */
  function onTypingComplete(){
    if (ruleEl) ruleEl.classList.add('show');
    setTimeout(() => {
      if (subEl) subEl.classList.add('show');
    }, 340);
  }

  /* ============================================
     5. BOOT
     ============================================ */
  function boot(){
    if (prefersReducedMotion){
      if (contentEl) contentEl.textContent = CFG.text;
      if (ruleEl) ruleEl.classList.add('show');
      if (subEl) subEl.classList.add('show');
      if (counterEl) counterEl.textContent = '100';
      if (fillEl) fillEl.style.transform = 'scaleX(1)';
      if (statusEl) statusEl.textContent = 'Siap';
      setTimeout(fadeOutAndGo, 900);
      return;
    }

    let typeDuration = CFG.startDelay;
    Array.from(CFG.text).forEach((ch) => {
      let d = CFG.typeSpeed;
      if (ch === ' ')  d += 55;
      if (ch === ',')  d += 110;
      if (ch === "'")  d += 40;
      if (ch === '.')  d += 150;
      typeDuration += d;
    });
    typeDuration += CFG.afterTypeDelay;

    const totalDuration = Math.max(typeDuration, 3600);

    startProgress(totalDuration);
    typeWriter(onTypingComplete);

    setTimeout(fadeOutAndGo, totalDuration + 1700);
  }

  /* ============================================
     6. SKIP
     ============================================ */
  if (skipBtn){
    skipBtn.addEventListener('click', (e) => {
      e.preventDefault();
      fadeOutAndGo();
    });
  }

  /* ============================================
     INIT
     ============================================ */
  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

})();
</script>

</body>
</html>
